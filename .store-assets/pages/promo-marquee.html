<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ReqFreedom marquee</title>
    <style>
      /*
       * 方向 B 的 Marquee 版本（1400x560）。
       *
       * 画布比例 2.5:1，比 440x280 的图块扁得多，不能直接等比放大：
       * 图块是「文案在上、母题在下」，这里改成左右分栏，把加宽出来的
       * 横向空间全部让给分流曲线，曲线跑完整段才立得住。
       */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
        position: relative;
        background: #14111f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
      }
      /* 右侧的流光辉光，给分流母题打底 */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(58% 90% at 92% 50%, rgba(139, 92, 246, 0.34), transparent 70%),
          radial-gradient(38% 55% at 86% 18%, rgba(42, 138, 246, 0.26), transparent 72%),
          radial-gradient(38% 55% at 88% 88%, rgba(233, 42, 103, 0.22), transparent 72%);
      }
      .motif { position: absolute; inset: 0; }
      /* 文案占左栏，垂直居中 */
      .copy {
        position: absolute;
        left: 96px;
        top: 50%;
        transform: translateY(-50%);
      }
      .mark svg { width: 68px; height: 68px; }
      .wordmark {
        margin-top: 28px;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .tagline {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
      }
      .channel-label {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- 母题：一条请求进来，被规则节点分流到网络层 / 页面补丁两条通道 -->
    <svg class="motif" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="track" x1="712" y1="280" x2="1320" y2="190" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8b5cf6" />
          <stop offset="1" stop-color="#2a8af6" />
        </linearGradient>
        <linearGradient id="track2" x1="712" y1="280" x2="1320" y2="370" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8b5cf6" />
          <stop offset="1" stop-color="#e92a67" />
        </linearGradient>
      </defs>
      <!-- 入口请求 -->
      <path d="M560 280 H656" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" />
      <!-- 上行通道：网络层（DNR），实线 -->
      <path d="M714 266 C830 266 880 190 1010 190 H1316" stroke="url(#track)" stroke-width="6" stroke-linecap="round" />
      <!-- 下行通道：页面补丁，虚线 -->
      <path d="M714 294 C830 294 880 370 1010 370 H1316" stroke="url(#track2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 15" />
      <!-- 规则节点 -->
      <rect x="658" y="252" width="56" height="56" rx="18" fill="#14111f" stroke="rgba(255,255,255,0.85)" stroke-width="5" />
      <circle cx="560" cy="280" r="9" fill="rgba(255,255,255,0.7)" />
      <circle cx="1316" cy="190" r="9.5" fill="#2a8af6" />
      <circle cx="1316" cy="370" r="9.5" fill="#e92a67" />
      <!-- 通道标签，用词与规则编辑器里的两个 Tab 保持一致 -->
      <text class="channel-label" x="1300" y="158" text-anchor="end" fill="rgba(120,180,255,0.92)">Network layer</text>
      <text class="channel-label" x="1300" y="416" text-anchor="end" fill="rgba(255,140,180,0.92)">Page patch</text>
    </svg>
    <div class="copy">
      <div class="mark">
        <svg viewBox="18 18 92 92" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <path d="M29 28 L29 100" />
          <path d="M29 28 L49 28 C65 28 65 54 49 54 L29 54" />
          <path d="M43 54 L63 100" />
          <path d="M75 28 L75 100" />
          <path d="M75 28 L99 28" />
          <path d="M75 58 L93 58" />
        </svg>
      </div>
      <div class="wordmark">ReqFreedom</div>
      <div class="tagline">Intercept · Mock · Throttle</div>
    </div>
    <script>
      window.__assetReady = false;
      // 等字体真正可用再拍，否则可能拍到回退字体的排版
      document.fonts.ready.then(() => {
        setTimeout(() => {
          window.__assetReady = true;
        }, 200);
      });
    </script>
  </body>
</html>
